<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Guess the Number</title>
</head>

<body>

    <main class="game">
        <span class="game__tag">// secret number</span>

        <header class="game__header">
            <h1></h1>
            <p class="game__paragraph">Pick a number between <strong>1</strong> and <strong>10</strong>.</p>
        </header>

        <form class="game__form" onsubmit="event.preventDefault(); verificarChute();">
            <label for="chute" class="game__label">Your guess</label>
            <input id="chute" type="number" min="1" max="10" class="game__input" placeholder="—">

            <div class="game__actions">
                <button type="submit" onclick="verifyGuess()" class="game__button game__button--primary">Guess</button>
                <button type="button" onclick="" id="reiniciar"
                    class="game__button game__button--secondary" disabled>New game</button>
            </div>
        </form>
    </main>

    <script src="app.js" defer></script>
</body>

</html>
