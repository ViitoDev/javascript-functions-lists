<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Adivinhe o Número</title>
</head>

<body>

    <main class="game">
        <span class="game__tag">// número secreto</span>

        <header class="game__header">
            <h1>Adivinhe o número</h1>
            <p class="game__paragrafo">Escolha um número entre <strong>1</strong> e <strong>10</strong>.</p>
        </header>

        <form class="game__form" onsubmit="event.preventDefault(); verificarChute();">
            <label for="chute" class="game__label">Seu palpite</label>
            <input id="chute" type="number" min="1" max="10" class="game__input" placeholder="—">

            <div class="game__acoes">
                <button type="submit" class="game__botao game__botao--primario">Chutar</button>
                <button type="button" onclick="" id="reiniciar"
                    class="game__botao game__botao--secundario" disabled>Novo jogo</button>
            </div>
        </form>
    </main>

    <script src="app.js" defer></script>
</body>

</html>
